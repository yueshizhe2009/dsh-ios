name: Build DSH iOS IPA

# 在 GitHub 的 macOS runner 上产出未签名 .ipa。
# 本机构建需要 macOS + Xcode 27；这份 workflow 让没有 Mac 也能出产物。
# 注意：未签名 .ipa 不能直接装到设备，需要用自己的 Apple ID 重新签名
# （Sideloadly / AltStore）后侧载。

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ipa.yml"
      - "app/**"
      - "scripts/**"
      - "rootfs/**"
      - "ish-arm64/**"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: build-dsh-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # xcode-27 = macOS 27 + Xcode 27（public preview）。项目 README 要求 Xcode 27。
    runs-on: xcode-27
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          uname -m
          echo "hostname: $(hostname)"
          hostname | awk '{print "hostname length:", length($0)}'
          xcodebuild -version
          xcode-select -p
          node --version
          ruby --version

      - name: Install build tools
        run: |
          # libarchive 必须装：ish-arm64/tools/meson.build:24 用 dependency('libarchive')
          # 找系统库，找不到就整块跳过 → fakefsify 不会被编译 → make rootfs 失败。
          brew install meson ninja lld libarchive
          gem install xcodeproj --no-document

      - name: Verify toolchain libs
        run: |
          command -v ld.lld
          ld.lld --version
          echo "libarchive prefix: $(brew --prefix libarchive)"
          ls -1 "$(brew --prefix libarchive)/lib/" | grep -i '^libarchive' || true
          pkg-config --modversion libarchive 2>/dev/null || echo "pkg-config: libarchive.pc 未注册（meson 会走 find_library 回退）"

      - name: Build emulator (iSH-ARM64)
        run: make emulator

      - name: Build guest rootfs (Alpine + Node 22 + dsh)
        run: make rootfs

      - name: Generate Xcode project
        run: make project

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project DSH.xcodeproj \
            -scheme DSH \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/DSH.app"
          test -d "$APP"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/DSH.app
          ( cd build/ipa && zip -qry ../DSH-unsigned.ipa Payload )
          ls -lh build/DSH-unsigned.ipa

      - name: Upload IPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-ios-${{ github.run_number }}
          path: |
            build/DSH-unsigned.ipa
            build/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
